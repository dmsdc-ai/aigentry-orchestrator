name: Windows private-storage ACL prototype (#1167, fake-data, test-only)

# #1167 isolated FEASIBILITY prototype (CONTRACT-r2 §4). Two jobs on disposable GitHub-hosted runners:
#  1. compile: MSVC build of the coder-owned helper against pinned official Node-API inputs; binary sha256
#     becomes a job output. A compile failure blocks the test job (needs:).
#  2. acl-tests: run-validation.ps1 creates two fake standard local users (A owner, B other), fake fixtures
#     under RUNNER_TEMP and owned FAT32/exFAT VHDs, runs the helper ONLY as A, B's denials as B, verdict from
#     an independent oracle, then removes exactly what it created. Receipts upload only from the admin-verified
#     export of the trust root bound before any fake account existed.
# Not product, release, install, durability (G2) or security acceptance. auth.ts / package.json os[] /
# W0/W1 / existing workflows are untouched and pinned below. No secrets, no publish, no PR trigger.
# Node pins: official https://nodejs.org/dist/v20.20.2/ SHASUMS256.txt entries supplied by the controller
# (supplement-node manifest f4297856...; TLS-verified, not GPG-verified). Prototype pins, not a support matrix.

on:
  push:
    branches: [ test/1167-private-storage-20261004 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-private-storage-prototype-${{ github.ref }}
  cancel-in-progress: false

env:
  PSP_NODE_VERSION: 20.20.2
  PSP_NODE_EXE_SHA256: 56c1520ee33b801e8bdb92fb321cf2e98529735b6d12bd4a2a6dec0ac0bab937      # win-x64/node.exe
  PSP_NODE_HEADERS_SHA256: 6de0e836efa9f32512e61db3dfd08b3d97a015b7e828d1a5efdf281a56a692d9  # node-v20.20.2-headers.tar.gz
  PSP_NODE_LIB_SHA256: c4a794e993d9304238523230885e9ec00ca052c73b9558471858eef14916d91f      # win-x64/node.lib
  PSP_HELPER_BASENAME: private-storage.node
  PSP_WRAPPER_SHA256: 76f7ab76f27e6f9d58f8df19499aab259a1cbdad8ac0d5089e01d7a05e77fc9f

defaults:
  run:
    shell: bash

jobs:
  compile:
    name: Compile helper (win32-x64, MSVC cl)
    if: github.ref == 'refs/heads/test/1167-private-storage-20261004'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      helper_sha256: ${{ steps.hash.outputs.helper_sha256 }}
    steps:
      - name: Keep LF bytes and seed a FAILED placeholder build receipt
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          mkdir -p "${RUNNER_TEMP}/psp1167-build"
          printf '%s\n' '{"schema":"aigentry/1167-psp-build/v1","task":"1167","status":"FAILED","reason":"build-not-reached","productAcceptance":false}' > "${RUNNER_TEMP}/psp1167-build/build-receipt.json"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pins must be resolved and match before anything from the tree executes
        run: |
          set -euo pipefail
          echo "checked-out sha: ${GITHUB_SHA} ref: ${GITHUB_REF}"
          [ "${GITHUB_REF}" = "refs/heads/test/1167-private-storage-20261004" ] || { echo "::error::unexpected ref ${GITHUB_REF}"; exit 1; }
          FAIL=0
          for V in PSP_NODE_VERSION PSP_NODE_EXE_SHA256 PSP_NODE_HEADERS_SHA256 PSP_NODE_LIB_SHA256 PSP_HELPER_BASENAME PSP_WRAPPER_SHA256; do
            if [ -z "${!V}" ] || [ "${!V}" = "UNRESOLVED" ]; then echo "::error::${V} is UNRESOLVED (controller input required)"; FAIL=1; fi
          done
          check() {
            if [ ! -f "$2" ]; then echo "::error::$2 is missing"; FAIL=1; return 0; fi
            ACTUAL="$(sha256sum -b < "$2" | cut -d" " -f1)"
            if [ "${ACTUAL}" = "$1" ]; then echo "pin ok ${ACTUAL} $2"; else echo "::error::$2 sha256 ${ACTUAL} does not match pin $1"; FAIL=1; fi
          }
          # independent harness (tester-owned)
          check 4e29cd117499a0115f6a4bb03e9b3e309f362598a8808d120953cfc186ed46f4 prototypes/windows-private-storage/tests/acl.test.mjs
          check e08a0373bf33f0f10052dd76977055287e8c88b573219a338e64f2b71fc99dd1 prototypes/windows-private-storage/tests/wrapper.test.mjs
          check 2811ca4174da3471ccad829d5515b60ccddc10ce53b6a534b6929eb8d2f8be14 prototypes/windows-private-storage/tests/setup-fixtures.ps1
          check 944dfdd13f176eed9df0340db45a81a7d83e68308667ee7bc4980b10956fb751 prototypes/windows-private-storage/tests/run-as-user.ps1
          check bc44b257f4cd2e2212380be5ef328eccbda84f543788a569ebaae727b1bc603f prototypes/windows-private-storage/tests/run-validation.ps1
          # baseline that must stay byte-identical (release 148d3b67 staged inputs)
          check 51343c903455905eb96d22f3c6111493dc24e11fa651718e66ea792dfacb5a30 src/hitl/web/auth.ts
          check 14e8bed19324f0b23ebb0abdd4dea3248c6b5ecdeed783fe7c0414237dc37feb src/hitl/web/auth-port.ts
          check a5b293836105f2a02072e1cb4214940c61ea2798c3c899e15a3e847222a40f5d package.json
          check 68cbe93558dfcf1ffcc3994e1583bd63510f4f1049fe856bda90afff4a16a35e src/session/persistence/atomic-write.ts
          check 0163aadccc743031f6e907e92d2a2058dd3838b591fc60aaac905be2d12240e4 src/session/persistence/index-lock.ts
          check 2a711cfac1ff8786808f1e502867cae6f6dee490eb77175a72aeb0f8f0df3595 .github/workflows/windows-fake-cmux-acceptance.yml
          # coder-owned candidate (independently authored; candidate-r1 manifest 76e661ec..., wc1167aca correction: C unchanged)
          check 0e91544eeadb6d426ba8ef2258fd278caae17ae4f23731a2700ddce23f5eae3c prototypes/windows-private-storage/native/private_storage.c
          check c9f6af2a1da16746b2383a317fa5b958d4a018220e63ff2df93ce7fda1900f19 prototypes/windows-private-storage/native/build.ps1
          check ${PSP_WRAPPER_SHA256} prototypes/windows-private-storage/private-storage.mjs
          check 304f801266c6019f53705d659595f40b4356ab734ab806f164010b1a845082de prototypes/windows-private-storage/README.md
          echo "recorded $(sha256sum -b < .github/workflows/windows-private-storage-prototype.yml | cut -d" " -f1) .github/workflows/windows-private-storage-prototype.yml"
          [ "${FAIL}" = "0" ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PSP_NODE_VERSION }}

      - name: Node runtime must be the pinned official build
        run: |
          set -euo pipefail
          [ "$(node --version)" = "v${PSP_NODE_VERSION}" ] || { echo "::error::node $(node --version) != v${PSP_NODE_VERSION}"; exit 1; }
          NODE_EXE="$(node -p 'process.execPath')"
          ACTUAL="$(sha256sum -b < "${NODE_EXE}" | cut -d" " -f1)"
          [ "${ACTUAL}" = "${PSP_NODE_EXE_SHA256}" ] || { echo "::error::node.exe sha256 ${ACTUAL} != pin"; exit 1; }
          echo "node ok ${ACTUAL} ${NODE_EXE}"

      - name: Fetch pinned official Node-API headers and import library
        run: |
          set -euo pipefail
          # GNU tar -C rejects the Windows-backslash RUNNER_TEMP spelling; build D from its checked Unix form.
          U="$(cygpath -u "${RUNNER_TEMP}")" && [ -n "${U}" ] || { echo "::error::cygpath -u RUNNER_TEMP failed"; exit 1; }
          D="${U}/psp1167-build/node"
          mkdir -p "${D}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${D}/headers.tar.gz" "https://nodejs.org/dist/v${PSP_NODE_VERSION}/node-v${PSP_NODE_VERSION}-headers.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${D}/node.lib" "https://nodejs.org/dist/v${PSP_NODE_VERSION}/win-x64/node.lib"
          [ "$(sha256sum -b < "${D}/headers.tar.gz" | cut -d" " -f1)" = "${PSP_NODE_HEADERS_SHA256}" ] || { echo "::error::headers tarball hash mismatch"; exit 1; }
          [ "$(sha256sum -b < "${D}/node.lib" | cut -d" " -f1)" = "${PSP_NODE_LIB_SHA256}" ] || { echo "::error::node.lib hash mismatch"; exit 1; }
          tar -xzf - -C "${D}" < "${D}/headers.tar.gz"
          INC="${D}/node-v${PSP_NODE_VERSION}/include/node"
          # The official 20.20.2 headers equal the four staged task inputs (verified offline); gate on them.
          hdr() { A="$(sha256sum -b < "${INC}/$2" | cut -d" " -f1)"; [ "${A}" = "$1" ] || { echo "::error::$2 ${A} != $1"; exit 1; }; echo "header ok ${A} $2"; }
          hdr 89393f07881fcba3ed097a5989fba1746f1c2cf611f19ba4dcb17071da8a661e js_native_api.h
          hdr 0410c31e227f81e2981363c4d543f4832ac3df785343ec64cee621742ff8a034 js_native_api_types.h
          hdr cf2446da4783a707dc9399321cff3ea28dce86fafdf38746fc47f1b293f5a040 node_api.h
          hdr 8d5d854088d5725fec9775510e0aeeeb790a41ad083c49bb721d950b86e6bd61 node_api_types.h
          echo "PSP_NODE_HEADERS_DIR=$(cygpath -w "${INC}")" >> "${GITHUB_ENV}"
          echo "PSP_NODE_LIB=$(cygpath -w "${D}/node.lib")" >> "${GITHUB_ENV}"
          echo "PSP_HELPER_OUT=$(cygpath -w "${RUNNER_TEMP}/psp1167-build/out")" >> "${GITHUB_ENV}"

      # Separate build step: the coder-owned script compiles with cl from vcvars64; this job never runs tests.
      - name: Build helper with MSVC (coder-owned native/build.ps1)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          for /f "delims=" %%c in ('where cl.exe') do if not defined CLEXE set "CLEXE=%%c"
          if not defined CLEXE exit /b 1
          if not exist "%PSP_HELPER_OUT%" mkdir "%PSP_HELPER_OUT%"
          cl 1> nul 2> "%RUNNER_TEMP%\psp1167-build\cl-version.txt"
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\prototypes\windows-private-storage\native\build.ps1" -ClExe "%CLEXE%" -NodeIncludeDir "%PSP_NODE_HEADERS_DIR%" -NodeLib "%PSP_NODE_LIB%" -OutputPath "%PSP_HELPER_OUT%\%PSP_HELPER_BASENAME%" -ExpectedNodeLibSha256 %PSP_NODE_LIB_SHA256% || exit /b 1

      - name: Hash helper and write the build receipt
        id: hash
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/psp1167-build/out/${PSP_HELPER_BASENAME}"
          [ -f "${F}" ] || { echo "::error::build produced no ${PSP_HELPER_BASENAME}"; exit 1; }
          SHA="$(sha256sum -b < "${F}" | cut -d" " -f1)"
          CL="$(head -n 1 "${RUNNER_TEMP}/psp1167-build/cl-version.txt" | tr -d '\r"\\')"
          echo "helper_sha256=${SHA}" >> "${GITHUB_OUTPUT}"
          printf '{"schema":"aigentry/1167-psp-build/v1","task":"1167","status":"BUILT","arch":"win32-x64","helper":"%s","sha256":"%s","cl":"%s","node":"%s","runId":"%s","sourceSha":"%s","productAcceptance":false}\n' \
            "${PSP_HELPER_BASENAME}" "${SHA}" "${CL}" "${PSP_NODE_VERSION}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > "${RUNNER_TEMP}/psp1167-build/build-receipt.json"
          echo "helper ${SHA} ${PSP_HELPER_BASENAME}"

      - name: Upload helper binary
        uses: actions/upload-artifact@v4
        with:
          name: psp1167-helper-win32-x64
          path: ${{ runner.temp }}/psp1167-build/out/${{ env.PSP_HELPER_BASENAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psp1167-build-receipt
          path: |
            ${{ runner.temp }}/psp1167-build/build-receipt.json
            ${{ runner.temp }}/psp1167-build/cl-version.txt
            ${{ runner.temp }}/psp1167-build/out/*.build.json
          if-no-files-found: error
          retention-days: 7

  acl-tests:
    name: ACL feasibility tests (fake users A/B, disposable runner)
    needs: compile
    if: github.ref == 'refs/heads/test/1167-private-storage-20261004'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Keep LF bytes and seed a FAILED placeholder run receipt
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          mkdir -p "${RUNNER_TEMP}/psp1167-receipts"
          printf '%s\n' '{"schema":"aigentry/1167-psp-run/v1","task":"1167","status":"FAILED","reason":"validation-not-reached","productAcceptance":false,"feasibilityOnly":true}' > "${RUNNER_TEMP}/psp1167-receipts/run.json"

      # Binds this run's trust-root name before any fake account or lower-privileged process exists (the runner
      # keeps the output in its own context). Later steps use only this exact name: no RUNNER_TEMP glob.
      - name: Bind the trust-root name for this run
        id: bind
        run: |
          set -euo pipefail
          LEAF="psp1167-trust-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "${LEAF}" =~ ^psp1167-trust-[0-9a-f]{16}$ ]] || { echo "::error::trust-root name not generated"; exit 1; }
          echo "trust_leaf=${LEAF}" >> "${GITHUB_OUTPUT}"
          echo "trust root name ${LEAF}"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pins must be resolved and match before anything from the tree executes
        run: |
          set -euo pipefail
          echo "checked-out sha: ${GITHUB_SHA} ref: ${GITHUB_REF}"
          [ "${GITHUB_REF}" = "refs/heads/test/1167-private-storage-20261004" ] || { echo "::error::unexpected ref ${GITHUB_REF}"; exit 1; }
          FAIL=0
          for V in PSP_NODE_VERSION PSP_NODE_EXE_SHA256 PSP_NODE_HEADERS_SHA256 PSP_NODE_LIB_SHA256 PSP_HELPER_BASENAME PSP_WRAPPER_SHA256; do
            if [ -z "${!V}" ] || [ "${!V}" = "UNRESOLVED" ]; then echo "::error::${V} is UNRESOLVED (controller input required)"; FAIL=1; fi
          done
          check() {
            if [ ! -f "$2" ]; then echo "::error::$2 is missing"; FAIL=1; return 0; fi
            ACTUAL="$(sha256sum -b < "$2" | cut -d" " -f1)"
            if [ "${ACTUAL}" = "$1" ]; then echo "pin ok ${ACTUAL} $2"; else echo "::error::$2 sha256 ${ACTUAL} does not match pin $1"; FAIL=1; fi
          }
          # independent harness (tester-owned)
          check 4e29cd117499a0115f6a4bb03e9b3e309f362598a8808d120953cfc186ed46f4 prototypes/windows-private-storage/tests/acl.test.mjs
          check e08a0373bf33f0f10052dd76977055287e8c88b573219a338e64f2b71fc99dd1 prototypes/windows-private-storage/tests/wrapper.test.mjs
          check 2811ca4174da3471ccad829d5515b60ccddc10ce53b6a534b6929eb8d2f8be14 prototypes/windows-private-storage/tests/setup-fixtures.ps1
          check 944dfdd13f176eed9df0340db45a81a7d83e68308667ee7bc4980b10956fb751 prototypes/windows-private-storage/tests/run-as-user.ps1
          check bc44b257f4cd2e2212380be5ef328eccbda84f543788a569ebaae727b1bc603f prototypes/windows-private-storage/tests/run-validation.ps1
          # baseline that must stay byte-identical (release 148d3b67 staged inputs)
          check 51343c903455905eb96d22f3c6111493dc24e11fa651718e66ea792dfacb5a30 src/hitl/web/auth.ts
          check 14e8bed19324f0b23ebb0abdd4dea3248c6b5ecdeed783fe7c0414237dc37feb src/hitl/web/auth-port.ts
          check a5b293836105f2a02072e1cb4214940c61ea2798c3c899e15a3e847222a40f5d package.json
          check 68cbe93558dfcf1ffcc3994e1583bd63510f4f1049fe856bda90afff4a16a35e src/session/persistence/atomic-write.ts
          check 0163aadccc743031f6e907e92d2a2058dd3838b591fc60aaac905be2d12240e4 src/session/persistence/index-lock.ts
          check 2a711cfac1ff8786808f1e502867cae6f6dee490eb77175a72aeb0f8f0df3595 .github/workflows/windows-fake-cmux-acceptance.yml
          # coder-owned candidate (independently authored; candidate-r1 manifest 76e661ec..., wc1167aca correction: C unchanged)
          check 0e91544eeadb6d426ba8ef2258fd278caae17ae4f23731a2700ddce23f5eae3c prototypes/windows-private-storage/native/private_storage.c
          check c9f6af2a1da16746b2383a317fa5b958d4a018220e63ff2df93ce7fda1900f19 prototypes/windows-private-storage/native/build.ps1
          check ${PSP_WRAPPER_SHA256} prototypes/windows-private-storage/private-storage.mjs
          check 304f801266c6019f53705d659595f40b4356ab734ab806f164010b1a845082de prototypes/windows-private-storage/README.md
          echo "recorded $(sha256sum -b < .github/workflows/windows-private-storage-prototype.yml | cut -d" " -f1) .github/workflows/windows-private-storage-prototype.yml"
          [ "${FAIL}" = "0" ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PSP_NODE_VERSION }}

      - name: Node runtime must be the pinned official build
        run: |
          set -euo pipefail
          [ "$(node --version)" = "v${PSP_NODE_VERSION}" ] || { echo "::error::node $(node --version) != v${PSP_NODE_VERSION}"; exit 1; }
          NODE_EXE="$(node -p 'process.execPath')"
          ACTUAL="$(sha256sum -b < "${NODE_EXE}" | cut -d" " -f1)"
          [ "${ACTUAL}" = "${PSP_NODE_EXE_SHA256}" ] || { echo "::error::node.exe sha256 ${ACTUAL} != pin"; exit 1; }
          echo "node ok ${ACTUAL} ${NODE_EXE}"

      # Tester-owned in-memory probe of the exact RawSecurityDescriptor / RawAcl.Item / GenericAce.GetBinaryForm / ControlFlags /
      # AreAccessRulesCanonical APIs the rbctrl/aceraw diagnostics use (fake in-memory descriptors only; no path, ACL, account or
      # privilege). Runs before any fake account exists; a pin mismatch, an unsupported API or any failed case fails the job.
      - name: RawAcl API probe (in-memory descriptors only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $f = Join-Path $env:GITHUB_WORKSPACE 'prototypes\windows-private-storage\tests\rawacl-api.selftest.ps1'
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
          if ($h -cne '8ecfe847158d8cb4a52bf163f5cb9ad797b91a608e11175c4389cefb10f18bdf') { Write-Output "::error::rawacl-api.selftest.ps1 sha256 $h does not match pin"; exit 1 }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $f
          exit $LASTEXITCODE

      # Pure-Node oracle selfcheck (synthetic inputs only; no native, no helper, no fake accounts). Fail-closed.
      - name: Oracle selfcheck (pure Node only)
        run: |
          set -euo pipefail
          env -u PSP_WRAPPER_PATH PSP_PHASE=selfcheck node --test --test-reporter=tap prototypes/windows-private-storage/tests/acl.test.mjs | tee "${RUNNER_TEMP}/psp1167-receipts/acl-selfcheck.tap"

      # Wrapper regression against a STUB native (fake process.dlopen, fake bytes). Runs before the helper is
      # downloaded: the real helper is never loaded here; it loads only as fake user A in the validation step.
      - name: Wrapper regression tests (stub native only)
        run: |
          set -euo pipefail
          PSP_WRAPPER_UNDER_TEST_SHA256="${PSP_WRAPPER_SHA256}" node --test --test-reporter=tap prototypes/windows-private-storage/tests/wrapper.test.mjs | tee "${RUNNER_TEMP}/psp1167-receipts/wrapper-test.tap"

      - name: Download helper binary
        uses: actions/download-artifact@v4
        with:
          name: psp1167-helper-win32-x64
          path: ${{ runner.temp }}/psp1167-helper

      - name: Helper must equal the compile-job hash
        env:
          EXPECTED: ${{ needs.compile.outputs.helper_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum -b < "${RUNNER_TEMP}/psp1167-helper/${PSP_HELPER_BASENAME}" | cut -d" " -f1)"
          [ -n "${EXPECTED}" ] && [ "${ACTUAL}" = "${EXPECTED}" ] || { echo "::error::helper ${ACTUAL} != compile output ${EXPECTED}"; exit 1; }
          echo "helper ok ${ACTUAL}"

      # Tester-owned self-test of the exact trust-root predicate in the cleanup/export steps below: in-memory .NET
      # descriptors and a stubbed Get-Acl only (no host ACL/account/VHD state). Runs before any fake account exists;
      # a pin mismatch, source drift or any failed positive/negative case fails the job.
      - name: Trust-root predicate self-test (in-memory descriptors only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $f = Join-Path $env:GITHUB_WORKSPACE 'prototypes\windows-private-storage\tests\bootstrap-trust.test.ps1'
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
          if ($h -cne 'e0f54ec4e6a0a371c22456b6772fdc8db8cda570f08d54db343598b0058d0ff1') { Write-Output "::error::bootstrap-trust.test.ps1 sha256 $h does not match pin"; exit 1 }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $f -WorkflowPath (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\windows-private-storage-prototype.yml')
          exit $LASTEXITCODE

      # Tester-owned self-test of Get-PspLiveSidProcesses (pinned setup-fixtures.ps1 extent) through both real caller forms,
      # with fake Get-CimInstance/Invoke-CimMethod functions only (no host CIM/process/account/ACL state); the frozen pre-fix
      # extent is a negative control. Runs before any fake account exists; a pin mismatch or any failed case fails the job.
      - name: Live-process result self-test (fake CIM only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $f = Join-Path $env:GITHUB_WORKSPACE 'prototypes\windows-private-storage\tests\live-process-results.selftest.ps1'
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
          if ($h -cne '4dc18dedafb0e7fcafe0e6ddc3c7ae4256377b021b0d9ea9be65348cb79b1dc4') { Write-Output "::error::live-process-results.selftest.ps1 sha256 $h does not match pin"; exit 1 }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $f
          exit $LASTEXITCODE

      # Elevated orchestrator; the helper itself runs only as fake standard user A. Exit is unmasked.
      - name: Validation (fake users, fixtures, oracle, verdict, cleanup)
        shell: powershell
        env:
          PSP_HELPER_PATH: ${{ runner.temp }}\psp1167-helper\${{ env.PSP_HELPER_BASENAME }}
          PSP_HELPER_SHA256: ${{ needs.compile.outputs.helper_sha256 }}
          PSP_WRAPPER_PATH: ${{ github.workspace }}\prototypes\windows-private-storage\private-storage.mjs
          PSP_TRUST_LEAF: ${{ steps.bind.outputs.trust_leaf }}
        run: |
          & "$env:GITHUB_WORKSPACE\prototypes\windows-private-storage\tests\run-validation.ps1"
          exit $LASTEXITCODE

      # Removes only identities/VHDs/root recorded in the trusted state file, even if the step above was killed.
      # Runs the trusted copy inside the exact trust root bound before any fake account existed (never the
      # workspace copy, never a look-alike root found by name); any other shape refuses before anything executes.
      - name: Cleanup backstop (recorded resources only)
        if: always()
        shell: powershell
        env:
          PSP_TRUST_LEAF: ${{ steps.bind.outputs.trust_leaf }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          if (-not $env:PSP_TRUST_LEAF) { Write-Output 'cleanup: no trust-root binding; validation never ran'; exit 0 }
          if ($env:PSP_TRUST_LEAF -cnotmatch '^psp1167-trust-[0-9a-f]{16}$') { Write-Output 'cleanup: refusing malformed trust-root binding'; exit 1 }
          $p = Join-Path $env:RUNNER_TEMP $env:PSP_TRUST_LEAF
          if (-not (Test-Path -LiteralPath $p)) { Write-Output 'cleanup: bound trust root absent; nothing was created'; exit 0 }
          $t = @(Get-Item -LiteralPath $p -Force)
          # Trust-root predicate (identical in cleanup and export), read via the structured .NET descriptor, not SDDL text:
          # exact bound leaf, one plain directory (no reparse point), owner Administrators, protected DACL (AI optional,
          # nothing else) holding exactly one SYSTEM and one Administrators FullControl OI+CI explicit allow ACE. The
          # primary group is ignored (no write authority); anything unreadable or unexpected refuses.
          $sd = $null; $ok = $false
          try {
            $a = Get-Acl -LiteralPath $t[0].FullName; $sd = $a.Sddl
            $r = [System.Security.AccessControl.RawSecurityDescriptor]::new($a.GetSecurityDescriptorBinaryForm(), 0)
            $cf = [System.Security.AccessControl.ControlFlags]; $af = [System.Security.AccessControl.AceFlags]
            $need = [int]($cf::DiscretionaryAclPresent -bor $cf::DiscretionaryAclProtected)
            $allowed = $need -bor [int]($cf::SelfRelative -bor $cf::DiscretionaryAclAutoInherited)
            $aces = @(if ($null -ne $r.DiscretionaryAcl) { foreach ($e in $r.DiscretionaryAcl) { $e } })
            $ok = ($t.Count -eq 1) -and $t[0].PSIsContainer -and ($t[0].Name -ceq $env:PSP_TRUST_LEAF) -and
              (($t[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) -and ($null -ne $r.Owner) -and ($r.Owner.Value -ceq 'S-1-5-32-544') -and
              ($null -ne $r.DiscretionaryAcl) -and (([int]$r.ControlFlags -band $need) -eq $need) -and (([int]$r.ControlFlags -band -bnot $allowed) -eq 0) -and
              ($aces.Count -eq 2) -and (@($aces | Where-Object { -not (($_ -is [System.Security.AccessControl.CommonAce]) -and ($_.AceType -eq [System.Security.AccessControl.AceType]::AccessAllowed) -and
                (-not $_.IsCallback) -and ([int]$_.AceFlags -eq ([int]$af::ObjectInherit -bor [int]$af::ContainerInherit)) -and ($_.AccessMask -eq 0x1F01FF)) }).Count -eq 0) -and
              ((@($aces | ForEach-Object { $_.SecurityIdentifier.Value } | Sort-Object) -join ',') -ceq 'S-1-5-18,S-1-5-32-544')
          } catch { $ok = $false }
          if (-not $ok) { Write-Output "cleanup: refusing unverified trust root $($t[0].FullName) $sd"; exit 1 }
          & (Join-Path $t[0].FullName 'src\run-validation.ps1') -CleanupOnly -TrustRoot $t[0].FullName
          exit $LASTEXITCODE

      # The only upload source: the trusted copy captures this run's receipts from the exact bound trust root into a
      # new protected export dir (plain single-link files, no fake-user process alive). Refusal => nothing uploads.
      - name: Export verified receipts
        id: export
        if: always()
        shell: powershell
        env:
          PSP_TRUST_LEAF: ${{ steps.bind.outputs.trust_leaf }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          if ($env:PSP_TRUST_LEAF -cnotmatch '^psp1167-trust-[0-9a-f]{16}$') { Write-Output 'export: refusing, no trust-root binding for this run'; exit 1 }
          $p = Join-Path $env:RUNNER_TEMP $env:PSP_TRUST_LEAF
          if (-not (Test-Path -LiteralPath $p)) { Write-Output 'export: bound trust root absent; no evidence to upload'; exit 1 }
          $t = @(Get-Item -LiteralPath $p -Force)
          # Trust-root predicate (identical in cleanup and export), read via the structured .NET descriptor, not SDDL text:
          # exact bound leaf, one plain directory (no reparse point), owner Administrators, protected DACL (AI optional,
          # nothing else) holding exactly one SYSTEM and one Administrators FullControl OI+CI explicit allow ACE. The
          # primary group is ignored (no write authority); anything unreadable or unexpected refuses.
          $sd = $null; $ok = $false
          try {
            $a = Get-Acl -LiteralPath $t[0].FullName; $sd = $a.Sddl
            $r = [System.Security.AccessControl.RawSecurityDescriptor]::new($a.GetSecurityDescriptorBinaryForm(), 0)
            $cf = [System.Security.AccessControl.ControlFlags]; $af = [System.Security.AccessControl.AceFlags]
            $need = [int]($cf::DiscretionaryAclPresent -bor $cf::DiscretionaryAclProtected)
            $allowed = $need -bor [int]($cf::SelfRelative -bor $cf::DiscretionaryAclAutoInherited)
            $aces = @(if ($null -ne $r.DiscretionaryAcl) { foreach ($e in $r.DiscretionaryAcl) { $e } })
            $ok = ($t.Count -eq 1) -and $t[0].PSIsContainer -and ($t[0].Name -ceq $env:PSP_TRUST_LEAF) -and
              (($t[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) -and ($null -ne $r.Owner) -and ($r.Owner.Value -ceq 'S-1-5-32-544') -and
              ($null -ne $r.DiscretionaryAcl) -and (([int]$r.ControlFlags -band $need) -eq $need) -and (([int]$r.ControlFlags -band -bnot $allowed) -eq 0) -and
              ($aces.Count -eq 2) -and (@($aces | Where-Object { -not (($_ -is [System.Security.AccessControl.CommonAce]) -and ($_.AceType -eq [System.Security.AccessControl.AceType]::AccessAllowed) -and
                (-not $_.IsCallback) -and ([int]$_.AceFlags -eq ([int]$af::ObjectInherit -bor [int]$af::ContainerInherit)) -and ($_.AccessMask -eq 0x1F01FF)) }).Count -eq 0) -and
              ((@($aces | ForEach-Object { $_.SecurityIdentifier.Value } | Sort-Object) -join ',') -ceq 'S-1-5-18,S-1-5-32-544')
          } catch { $ok = $false }
          if (-not $ok) { Write-Output "export: refusing unverified trust root $($t[0].FullName) $sd"; exit 1 }
          & (Join-Path $t[0].FullName 'src\run-validation.ps1') -ExportOnly -TrustRoot $t[0].FullName
          exit $LASTEXITCODE

      - name: Upload raw receipts
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: psp1167-acl-receipts
          path: ${{ runner.temp }}/${{ steps.bind.outputs.trust_leaf }}/export
          if-no-files-found: error
          retention-days: 7
