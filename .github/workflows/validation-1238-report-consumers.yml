name: Validation 1238 report consumers

"on":
  push:
    branches: [validation/1238-report-consumers]

permissions:
  contents: read

jobs:
  report-consumers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      NODE_OPTIONS: ""
      BASH_ENV: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Prepare private runtime and record identity
        run: |
          umask 077
          selected_node="$(command -v node)"
          selected_npm="$(command -v npm)"
          case "$selected_node:$selected_npm" in /*:/*) ;; *) exit 1 ;; esac
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          checkout="$(pwd -P)"
          case "$runner_temp/" in "$checkout/"*|*/node_modules/*) exit 1 ;; esac
          runtime="$(mktemp -d "$runner_temp/report-consumers.XXXXXXXX")"
          chmod 0700 "$runtime"
          mkdir -m 0700 "$runtime/home" "$runtime/tmp" "$runtime/config" \
            "$runtime/cache" "$runtime/data" "$runtime/npm-cache"
          : > "$runtime/npm-user.rc"
          : > "$runtime/npm-global.rc"
          {
            printf "NODE_EXECUTABLE=%s\nNPM_CLI=%s\n" "$selected_node" "$selected_npm"
            printf "HOME=%s\nUSERPROFILE=%s\n" "$runtime/home" "$runtime/home"
            printf "XDG_CONFIG_HOME=%s\nXDG_CACHE_HOME=%s\nXDG_DATA_HOME=%s\n" \
              "$runtime/config" "$runtime/cache" "$runtime/data"
            printf "TMPDIR=%s\nnpm_config_cache=%s\n" "$runtime/tmp" "$runtime/npm-cache"
            printf "npm_config_userconfig=%s\nnpm_config_globalconfig=%s\n" \
              "$runtime/npm-user.rc" "$runtime/npm-global.rc"
          } >> "$GITHUB_ENV"
          printf "Runner: %s; event commit: %s\n" "$RUNNER_OS" "$GITHUB_SHA"
          env -i HOME="$runtime/home" USERPROFILE="$runtime/home" \
            XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache" \
            XDG_DATA_HOME="$runtime/data" TMPDIR="$runtime/tmp" PATH=/usr/bin:/bin \
            "$selected_node" --version
          # Fail on missing public POSIX tools; no alternate source or runtime.
          env -i HOME="$runtime/home" USERPROFILE="$runtime/home" \
            XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache" \
            XDG_DATA_HOME="$runtime/data" TMPDIR="$runtime/tmp" PATH=/usr/bin:/bin \
            /bin/bash --noprofile --norc -e -o pipefail -c '
              for tool in bash python3 mkfifo; do
                command -v "$tool" || { printf "Missing required tool: %s\n" "$tool" >&2; exit 1; }
              done
              bash --version
              python3 --version
              case "$1" in
                Linux) mkfifo --version ;;
                macOS) /usr/bin/sw_vers ;; # BSD mkfifo follows the OS release.
                *) exit 1 ;;
              esac
            ' _ "$RUNNER_OS"
      - name: Install locked dependencies without scripts
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH="$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            npm_config_cache="$npm_config_cache" \
            npm_config_userconfig="$npm_config_userconfig" \
            npm_config_globalconfig="$npm_config_globalconfig" \
            "$NODE_EXECUTABLE" "$NPM_CLI" ci --ignore-scripts --no-audit --no-fund
      # Original TS compiles to dist/src; these three .mjs callers run from source.
      # Protected tests/report/mandatory-report-1170.test.mjs is never executed.
      - name: Compile original TypeScript
        id: build
        run: |
          umask 077
          test ! -e dist
          test ! -L dist
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" node_modules/typescript/bin/tsc -p .
      - name: G2b binding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test tests/dispatch/agent-metadata/g2b-binding.test.mjs
      - name: Report security
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test tests/report/mandatory-report-1170-security.test.mjs
      - name: Turn hook
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test tests/report/mandatory-report-1136-hook.test.mjs
