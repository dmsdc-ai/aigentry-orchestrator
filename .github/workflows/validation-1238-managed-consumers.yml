                  child[key].on('close', () => { stream.closed = true; });
                  child[key].on('error', e => { stream.errors.push(errorInfo(e)); stop(key + '-error'); });
                }
                if (stdinBytes !== null) {
                  child.stdin.on('error', e => { errors.push({ operation: 'stdin', ...errorInfo(e) }); stop('stdin-error'); });
                  child.stdin.end(stdinBytes);
                }
                // Requests refusal/termination, not an instantaneous wall-clock or process-tree guarantee.
                const delayMs = Math.max(0, Math.min(timeoutMs - Number(process.hrtime.bigint() - start) / 1e6,
                  aggregateMs - aggregateElapsed()));
                timer = setTimeout(() => { timedOut = true; stop('timeout'); }, delayMs);
                await closed;
              } catch (e) {
                errors.push({ operation: 'spawn-or-observe', ...errorInfo(e) });
                if (child) stop('observation-error');
              } finally { clearTimeout(timer); }
              const elapsedMs = Number(process.hrtime.bigint() - start) / 1e6;
              const output = {};
              for (const key of ['stdout', 'stderr']) {
                const { chunks, ...counts } = streams[key];
                const bytes = Buffer.concat(chunks);
                save(name + '.' + key, bytes);
                output[key] = { ...counts, file: path.join(root, name + '.' + key), sha256: sha(bytes) };
              }
              const receipt = { ...descriptor, elapsedMs, aggregateElapsedMs: aggregateElapsed(),
                timedOut, overflow, errors, exit, close, status: close?.status ?? null, signal: close?.signal ?? null,
                kills, destroys, output };
              save(name + '.result.json', JSON.stringify(receipt, null, 2) + '\n');
              console.log('U2 result ' + JSON.stringify(receipt));
              for (const key of ['stdout', 'stderr']) {
                console.log('U2 raw ' + name + ' ' + key + ' begin');
                await new Promise((resolve, reject) => process.stdout.write(Buffer.concat(streams[key].chunks),
                  e => e ? reject(e) : resolve()));
                console.log('\nU2 raw ' + name + ' ' + key + ' end');
              }
              assert.equal(errors.length, 0);
              assert(!timedOut && !overflow && elapsedMs <= timeoutMs && aggregateElapsed() <= aggregateMs);
              assert(exit && close);
              assert.equal(exit.signal, null);
              assert.deepEqual(close, exit);
              for (const stream of Object.values(streams)) {
                assert(stream.eof && stream.closed && stream.errors.length === 0);
                assert(stream.receivedBytes <= perStreamLimit);
              }
              return { receipt, stderr: Buffer.concat(streams.stderr.chunks).toString('utf8'),
                stdout: Buffer.concat(streams.stdout.chunks).toString('utf8') };
            }

            const diagnostics = [
              { name: 'syntax-plain-js', argv: ['--check', path.join(owned.diagnostics, 'plain.js')],
                bytes: invalid, gate: 'observation', file: 'plain.js' },
              { name: 'syntax-invalid-mjs', argv: ['--check', path.join(owned.diagnostics, 'invalid.mjs')],
                bytes: invalid, gate: 'reject', file: 'invalid.mjs' },
              { name: 'syntax-valid-mjs', argv: ['--check', path.join(owned.diagnostics, 'valid.mjs')],
                bytes: valid, gate: 'accept', file: 'valid.mjs' },
              { name: 'syntax-invalid-stdin', argv: ['--input-type=module', '--check'],
                bytes: invalid, gate: 'reject', file: null }
