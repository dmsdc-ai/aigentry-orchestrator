name: Validation 1238 managed consumers

"on":
  push:
    branches: [validation/1238-managed-consumers]

permissions:
  contents: read

jobs:
  managed-consumers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      NODE_OPTIONS: ""
      BASH_ENV: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Prepare private runtime and record identity
        run: |
          umask 077
          selected_node="$(command -v node)"
          selected_npm="$(command -v npm)"
          case "$selected_node:$selected_npm" in /*:/*) ;; *) exit 1 ;; esac
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          checkout="$(pwd -P)"
          case "$runner_temp/" in "$checkout/"*) exit 1 ;; esac
          runtime="$(mktemp -d "$runner_temp/managed-consumers.XXXXXXXX")"
          chmod 0700 "$runtime"
          mkdir -m 0700 "$runtime/home" "$runtime/tmp" "$runtime/config" \
            "$runtime/cache" "$runtime/data" "$runtime/npm-cache"
          : > "$runtime/npm-user.rc"
          : > "$runtime/npm-global.rc"
          {
            printf "NODE_EXECUTABLE=%s\nNPM_CLI=%s\n" "$selected_node" "$selected_npm"
            printf "HOME=%s\nUSERPROFILE=%s\n" "$runtime/home" "$runtime/home"
            printf "XDG_CONFIG_HOME=%s\nXDG_CACHE_HOME=%s\nXDG_DATA_HOME=%s\n" \
              "$runtime/config" "$runtime/cache" "$runtime/data"
            printf "TMPDIR=%s\nnpm_config_cache=%s\n" "$runtime/tmp" "$runtime/npm-cache"
            printf "npm_config_userconfig=%s\nnpm_config_globalconfig=%s\n" \
              "$runtime/npm-user.rc" "$runtime/npm-global.rc"
          } >> "$GITHUB_ENV"
          printf "Runner: %s; event commit: %s\n" "$RUNNER_OS" "$GITHUB_SHA"
          /usr/bin/git rev-parse HEAD
          env -i PATH=/usr/bin:/bin "$selected_node" --version
      - name: Install locked dependencies without scripts
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH="$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            npm_config_cache="$npm_config_cache" \
            npm_config_userconfig="$npm_config_userconfig" \
            npm_config_globalconfig="$npm_config_globalconfig" \
            "$NODE_EXECUTABLE" "$NPM_CLI" ci --ignore-scripts --no-audit --no-fund
      - name: Compile original TypeScript
        id: build
        run: |
          umask 077
          test ! -e dist
          test ! -L dist
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" node_modules/typescript/bin/tsc -p .
      - name: Worker tool admission
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test dist/tests/session/worker-tool-admission.test.js
      - name: Worker sandbox providers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test dist/tests/session/worker-sandbox-providers.test.js
      - name: Release benchmark public CLI and pure contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 dist/tests/release-benchmark/contracts.test.js dist/tests/release-benchmark/compare.test.js dist/tests/release-benchmark/cli.test.js
      - name: Ordinary init first-parent prewrite regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            AIGENTRY_PREWRITE_FIXTURE_ROOT="$HOME" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 tests/packaging/legacy-init-prewrite.test.mjs
      - name: Retained-history bounded status regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          umask 077
          selected_python="$(command -v python3)"
          case "$selected_python" in /*) ;; *) exit 1 ;; esac
          status_root="$(mktemp -d "$TMPDIR/status-projection.XXXXXXXX")"
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin PYTHONIOENCODING=utf-8 PYTHONUTF8=1 \
            PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            STATUS_PYTHON_CANDIDATE="$selected_python" STATUS_ADMISSION_ROOT="$status_root" \
            "$NODE_EXECUTABLE" --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const candidate = process.env.STATUS_PYTHON_CANDIDATE;
          assert(candidate && path.isAbsolute(candidate));
          const selected = fs.realpathSync(candidate);
          assert(fs.lstatSync(selected).isFile());
          fs.accessSync(selected, fs.constants.X_OK);
          assert(!/[\r\n\t]/.test(selected));
          const sha256 = createHash('sha256').update(fs.readFileSync(selected)).digest('hex');
          const env = {};
          for (const key of ['HOME', 'USERPROFILE', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME', 'XDG_DATA_HOME',
            'TMPDIR', 'PATH', 'PYTHONIOENCODING', 'PYTHONUTF8', 'PYTHONDONTWRITEBYTECODE', 'PYTHONNOUSERSITE']) {
            assert(process.env[key]);
            env[key] = process.env[key];
          }
          const root = process.env.STATUS_ADMISSION_ROOT;
          assert(root && path.isAbsolute(root) && fs.realpathSync(root) === root);
          const result = spawnSync(selected, ['--version'], { cwd: root, env, shell: false,
            timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 4096, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          const receipt = { selected, sha256, argv: ['--version'], cwd: root, env, status: result.status,
            signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr };
          fs.writeFileSync(path.join(root, 'python-admission.json'), JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log(JSON.stringify(receipt));
          assert.ifError(result.error);
          assert.equal(result.signal, null);
          assert.equal(result.status, 0);
          assert.match((result.stdout + result.stderr).trim(), /^Python 3\.[0-9]+\.[0-9]+[^\r\n]*$/);
          fs.writeFileSync(path.join(root, 'python-selection.tsv'), selected + '\t' + sha256 + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          IFS=$'\t' read -r selected_python selected_python_sha256 < "$status_root/python-selection.tsv"
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            AIGENTRY_STATUS_TEST_ROOT="$status_root" \
            AIGENTRY_STATUS_TEST_PYTHON="$selected_python" \
            AIGENTRY_STATUS_TEST_PYTHON_SHA256="$selected_python_sha256" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 dist/tests/dispatch/registry-status-projection.test.js
