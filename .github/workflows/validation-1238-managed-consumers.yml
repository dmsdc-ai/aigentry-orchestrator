name: Validation 1238 managed consumers

"on":
  push:
    branches: [validation/1238-managed-consumers]

permissions:
  contents: read

jobs:
  managed-consumers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      NODE_OPTIONS: ""
      BASH_ENV: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Prepare private runtime and record identity
        run: |
          umask 077
          selected_node="$(command -v node)"
          selected_npm="$(command -v npm)"
          case "$selected_node:$selected_npm" in /*:/*) ;; *) exit 1 ;; esac
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          checkout="$(pwd -P)"
          case "$runner_temp/" in "$checkout/"*) exit 1 ;; esac
          runtime="$(mktemp -d "$runner_temp/managed-consumers.XXXXXXXX")"
          chmod 0700 "$runtime"
          mkdir -m 0700 "$runtime/home" "$runtime/tmp" "$runtime/config" \
            "$runtime/cache" "$runtime/data" "$runtime/npm-cache"
          : > "$runtime/npm-user.rc"
          : > "$runtime/npm-global.rc"
          {
            printf "NODE_EXECUTABLE=%s\nNPM_CLI=%s\n" "$selected_node" "$selected_npm"
            printf "HOME=%s\nUSERPROFILE=%s\n" "$runtime/home" "$runtime/home"
            printf "XDG_CONFIG_HOME=%s\nXDG_CACHE_HOME=%s\nXDG_DATA_HOME=%s\n" \
              "$runtime/config" "$runtime/cache" "$runtime/data"
            printf "TMPDIR=%s\nnpm_config_cache=%s\n" "$runtime/tmp" "$runtime/npm-cache"
            printf "npm_config_userconfig=%s\nnpm_config_globalconfig=%s\n" \
              "$runtime/npm-user.rc" "$runtime/npm-global.rc"
          } >> "$GITHUB_ENV"
          printf "Runner: %s; event commit: %s\n" "$RUNNER_OS" "$GITHUB_SHA"
          /usr/bin/git rev-parse HEAD
          env -i PATH=/usr/bin:/bin "$selected_node" --version
      - name: Install locked dependencies without scripts
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH="$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            npm_config_cache="$npm_config_cache" \
            npm_config_userconfig="$npm_config_userconfig" \
            npm_config_globalconfig="$npm_config_globalconfig" \
            "$NODE_EXECUTABLE" "$NPM_CLI" ci --ignore-scripts --no-audit --no-fund
      - name: Compile original TypeScript
        id: build
        run: |
          umask 077
          test ! -e dist
          test ! -L dist
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" node_modules/typescript/bin/tsc -p .
      - name: Worker tool admission
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test dist/tests/session/worker-tool-admission.test.js
      - name: Worker sandbox providers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test dist/tests/session/worker-sandbox-providers.test.js
      - name: Release benchmark public CLI and pure contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 dist/tests/release-benchmark/contracts.test.js dist/tests/release-benchmark/compare.test.js dist/tests/release-benchmark/cli.test.js
      - name: Ordinary init first-parent prewrite regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            AIGENTRY_PREWRITE_FIXTURE_ROOT="$HOME" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 tests/packaging/legacy-init-prewrite.test.mjs
      - name: Checkout pinned old status source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          ref: 340f5f6472a8bb1131c305cbf46dc8b490185aaa
          persist-credentials: false
          path: .ci-old-status-340f5f6
      - name: Admit complete old status closure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          old_receipts="$(mktemp -d "$TMPDIR/old-status.XXXXXXXX")"
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_OPTIONAL_LOCKS=0 \
            STATUS_CANDIDATE_ROOT="$(pwd -P)" STATUS_OLD_RECEIPTS="$old_receipts" \
            STATUS_ENV_FILE="$GITHUB_ENV" \
            "$NODE_EXECUTABLE" --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawn, spawnSync } = require('node:child_process');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const candidate = process.env.STATUS_CANDIDATE_ROOT;
          const receipts = process.env.STATUS_OLD_RECEIPTS;
          const envFile = process.env.STATUS_ENV_FILE;
          for (const value of [candidate, receipts, envFile]) {
            assert(value && path.isAbsolute(value) && !/[\r\n\t]/.test(value));
            assert.equal(fs.realpathSync(value), value);
          }
          const old = path.join(candidate, '.ci-old-status-340f5f6');
          assert.equal(fs.realpathSync(old), old);
          assert(fs.lstatSync(old).isDirectory());
          const env = {};
          for (const key of ['HOME', 'USERPROFILE', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME',
            'XDG_DATA_HOME', 'TMPDIR', 'PATH', 'GIT_CONFIG_NOSYSTEM', 'GIT_CONFIG_GLOBAL', 'GIT_OPTIONAL_LOCKS']) {
            assert(process.env[key]);
            env[key] = process.env[key];
          }
          const save = (name, value) => fs.writeFileSync(path.join(receipts, name),
            JSON.stringify(value, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          let gitSequence = 0;
          function git(args) {
            const start = process.hrtime.bigint();
            const result = spawnSync('/usr/bin/git', args, { cwd: old, env, shell: false,
              timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 1048576, encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'] });
            const receipt = { executable: '/usr/bin/git', args, cwd: old, env,
              status: result.status, signal: result.signal, error: result.error?.message ?? null,
              elapsedMs: Number(process.hrtime.bigint() - start) / 1e6,
              stdout: result.stdout, stderr: result.stderr };
            save(`git-${++gitSequence}.json`, receipt);
            console.log(JSON.stringify(receipt));
            assert.ifError(result.error);
            assert.equal(result.signal, null);
            assert.equal(result.status, 0);
            return result.stdout;
          }
          async function main() {
            assert.equal(git(['rev-parse', 'HEAD']).trim(), '340f5f6472a8bb1131c305cbf46dc8b490185aaa');
            git(['diff', '--exit-code', 'HEAD', '--']);
            const lock = fs.readFileSync(path.join(candidate, 'package-lock.json'));
            assert(lock.equals(fs.readFileSync(path.join(old, 'package-lock.json'))));
            const dependencies = path.join(candidate, 'node_modules');
            assert(fs.lstatSync(dependencies).isDirectory());
            for (const name of ['node_modules', 'dist']) {
              assert(!fs.readdirSync(old).includes(name), `old ${name} must be absent`);
            }
            fs.symlinkSync(dependencies, path.join(old, 'node_modules'), 'dir');
            const compiler = fs.realpathSync(path.join(dependencies, 'typescript/bin/tsc'));
            assert(fs.lstatSync(compiler).isFile());
            const executable = process.execPath;
            const argv = [compiler, '-p', '.'];
            const streams = Object.fromEntries(['stdout', 'stderr'].map(name => [name,
              { bytes: 0, retainedBytes: 0, chunks: [], eof: false, closed: false, error: null }]));
            const start = process.hrtime.bigint();
            let timedOut = false, overflow = false, error = null, exit = null, closed = false;
            const child = spawn(executable, argv, { cwd: old, env, shell: false,
              stdio: ['ignore', 'pipe', 'pipe'] });
            function stop() {
              child.kill('SIGKILL');
              child.stdout.destroy();
              child.stderr.destroy();
            }
            const timer = setTimeout(() => { timedOut = true; stop(); }, 60000);
            for (const name of ['stdout', 'stderr']) {
              const stream = streams[name];
              child[name].on('data', chunk => {
                stream.bytes += chunk.length;
                const retained = chunk.subarray(0, Math.max(0, 1048576 - stream.retainedBytes));
                stream.chunks.push(retained);
                stream.retainedBytes += retained.length;
                if (stream.bytes > 1048576) { overflow = true; stop(); }
              });
              child[name].on('end', () => { stream.eof = true; });
              child[name].on('close', () => { stream.closed = true; });
              child[name].on('error', e => { stream.error = e.message; stop(); });
            }
            child.on('error', e => { error = { message: e.message, code: e.code ?? null }; });
            child.on('exit', (status, signal) => { exit = { status, signal }; });
            const result = await new Promise(resolve => child.on('close', (status, signal) => {
              closed = true;
              clearTimeout(timer);
              resolve({ status, signal });
            }));
            const elapsedMs = Number(process.hrtime.bigint() - start) / 1e6;
            const output = {};
            for (const name of ['stdout', 'stderr']) {
              const { chunks, ...counts } = streams[name];
              const bytes = Buffer.concat(chunks);
              fs.writeFileSync(path.join(receipts, 'compile.' + name), bytes, { flag: 'wx', mode: 0o600 });
              output[name] = { ...counts, text: bytes.toString('utf8') };
            }
            const receipt = { executable, nodeSha256: sha(fs.readFileSync(executable)), argv,
              compilerSha256: sha(fs.readFileSync(compiler)), lockSha256: sha(lock), cwd: old, env,
              ...result, error, elapsedMs, timeoutMs: 60000, perStreamLimit: 1048576,
              timedOut, overflow, directChildExit: exit, directChildClose: closed, ...output };
            save('compile.json', receipt);
            console.log(JSON.stringify(receipt));
            assert.equal(error, null);
            assert(!timedOut && !overflow && elapsedMs <= 60000);
            assert.equal(result.status, 0);
            assert.equal(result.signal, null);
            assert.deepEqual(exit, { status: 0, signal: null });
            assert(closed);
            for (const stream of Object.values(streams)) {
              assert(stream.eof && stream.closed && stream.error === null);
            }
            git(['diff', '--exit-code', 'HEAD', '--']);
            const dist = path.join(old, 'dist');
            assert(fs.lstatSync(dist).isDirectory());
            const rows = [];
            function inventory(relative) {
              const full = path.join(dist, relative);
              const stat = fs.lstatSync(full);
              if (stat.isDirectory()) {
                for (const name of fs.readdirSync(full)) inventory(relative + '/' + name);
              } else {
                assert(stat.isFile(), `non-regular old closure entry: ${relative}`);
                rows.push({ path: relative, size: stat.size, sha256: sha(fs.readFileSync(full)) });
              }
            }
            inventory('src');
            rows.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
            const canonicalSha256 = sha(Buffer.from(JSON.stringify(rows), 'utf8'));
            const cli = path.join(dist, 'src/tracker/cli.js');
            assert.equal(fs.realpathSync(cli), cli);
            assert(fs.lstatSync(cli).isFile());
            const cliSha256 = sha(fs.readFileSync(cli));
            const closure = { source: '340f5f6472a8bb1131c305cbf46dc8b490185aaa',
              files: rows.length, bytes: rows.reduce((sum, row) => sum + row.size, 0),
              canonicalSha256, cli, cliSha256, rows };
            save('closure.json', closure);
            console.log(JSON.stringify({ ...closure, rows: undefined }));
            assert.equal(closure.files, 405);
            assert.equal(closure.bytes, 3245052);
            assert.equal(canonicalSha256, 'c19571bd59b376175b72d68b3d25c3038dedb1005f81adae5dcdc1d946d2968d');
            assert.equal(cliSha256, '434ba6d8012b945a257577c01ba736279217a3a0b5042377f38af052ef8ac24a');
            // Direct-child receipts do not establish descendant containment; legacy tests retain their own bounds.
            fs.appendFileSync(envFile, `AIGENTRY_STATUS_TEST_OLD_CLI=${cli}\nAIGENTRY_STATUS_TEST_OLD_CLI_SHA256=${cliSha256}\n`);
          }
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Retained-history bounded status regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          umask 077
          selected_python="$(command -v python3)"
          case "$selected_python" in /*) ;; *) exit 1 ;; esac
          status_root="$(mktemp -d "$TMPDIR/status-projection.XXXXXXXX")"
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin PYTHONIOENCODING=utf-8 PYTHONUTF8=1 \
            PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            STATUS_PYTHON_CANDIDATE="$selected_python" STATUS_ADMISSION_ROOT="$status_root" \
            "$NODE_EXECUTABLE" --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const candidate = process.env.STATUS_PYTHON_CANDIDATE;
          assert(candidate && path.isAbsolute(candidate));
          const selected = fs.realpathSync(candidate);
          assert(fs.lstatSync(selected).isFile());
          fs.accessSync(selected, fs.constants.X_OK);
          assert(!/[\r\n\t]/.test(selected));
          const sha256 = createHash('sha256').update(fs.readFileSync(selected)).digest('hex');
          const env = {};
          for (const key of ['HOME', 'USERPROFILE', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME', 'XDG_DATA_HOME',
            'TMPDIR', 'PATH', 'PYTHONIOENCODING', 'PYTHONUTF8', 'PYTHONDONTWRITEBYTECODE', 'PYTHONNOUSERSITE']) {
            assert(process.env[key]);
            env[key] = process.env[key];
          }
          const root = process.env.STATUS_ADMISSION_ROOT;
          assert(root && path.isAbsolute(root) && fs.realpathSync(root) === root);
          const result = spawnSync(selected, ['--version'], { cwd: root, env, shell: false,
            timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 4096, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          const receipt = { selected, sha256, argv: ['--version'], cwd: root, env, status: result.status,
            signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr };
          fs.writeFileSync(path.join(root, 'python-admission.json'), JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log(JSON.stringify(receipt));
          assert.ifError(result.error);
          assert.equal(result.signal, null);
          assert.equal(result.status, 0);
          assert.match((result.stdout + result.stderr).trim(), /^Python 3\.[0-9]+\.[0-9]+[^\r\n]*$/);
          fs.writeFileSync(path.join(root, 'python-selection.tsv'), selected + '\t' + sha256 + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          IFS=$'\t' read -r selected_python selected_python_sha256 < "$status_root/python-selection.tsv"
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            AIGENTRY_STATUS_TEST_ROOT="$status_root" \
            AIGENTRY_STATUS_TEST_PYTHON="$selected_python" \
            AIGENTRY_STATUS_TEST_PYTHON_SHA256="$selected_python_sha256" \
            AIGENTRY_STATUS_TEST_OLD_CLI="$AIGENTRY_STATUS_TEST_OLD_CLI" \
            AIGENTRY_STATUS_TEST_OLD_CLI_SHA256="$AIGENTRY_STATUS_TEST_OLD_CLI_SHA256" \
            PATH=/usr/bin:/bin "$NODE_EXECUTABLE" --test --test-concurrency=1 dist/tests/dispatch/registry-status-projection.test.js dist/tests/tracker/status-json.test.js tests/report/intermediate-report-review.test.mjs
          env -i HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin U1_STATUS_ROOT="$status_root" \
            U1_PYTHON="$selected_python" U1_PYTHON_SHA256="$selected_python_sha256" \
            "$NODE_EXECUTABLE" --input-type=commonjs <<'U1_NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawn } = require('node:child_process');
          const sha = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          async function main() {
            const root = process.env.U1_STATUS_ROOT;
            const python = process.env.U1_PYTHON;
            const pythonSha256 = process.env.U1_PYTHON_SHA256;
            for (const value of [root, python]) {
              assert(value && path.isAbsolute(value) && !/[\r\n\t]/.test(value));
              assert.equal(fs.realpathSync(value), value);
            }
            assert(fs.lstatSync(root).isDirectory());
            assert.equal(fs.lstatSync(root).uid, process.getuid());
            assert.equal(fs.lstatSync(root).mode & 0o777, 0o700);
            assert(fs.lstatSync(python).isFile());
            fs.accessSync(python, fs.constants.X_OK);
            assert.match(pythonSha256, /^[0-9a-f]{64}$/);
            assert.equal(sha(python), pythonSha256);
            const bin = path.join(root, 'u1-bin');
            fs.mkdirSync(bin, { mode: 0o700 });
            const launcher = path.join(bin, 'python3');
            fs.symlinkSync(python, launcher);
            assert.equal(fs.realpathSync(launcher), python);
            assert.equal(sha(launcher), pythonSha256);
            const env = {};
            for (const key of ['HOME', 'USERPROFILE', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME',
              'XDG_DATA_HOME', 'TMPDIR']) {
              assert(process.env[key]);
              env[key] = process.env[key];
            }
            env.PATH = bin + ':/usr/bin:/bin';
            env.PYTHONIOENCODING = 'utf-8';
            env.PYTHONUTF8 = '1';
            env.PYTHONDONTWRITEBYTECODE = '1';
            env.PYTHONNOUSERSITE = '1';
            const executable = process.execPath;
            const argv = ['--test', '--test-concurrency=1',
              'dist/tests/request-capture/intake.test.js', 'tests/request-capture/intake-registry.test.mjs'];
            const cwd = process.cwd();
            const timeoutMs = 180000, perStreamLimit = 1048576;
            const streams = Object.fromEntries(['stdout', 'stderr'].map(name => [name,
              { receivedBytes: 0, retainedBytes: 0, chunks: [], eof: false, closed: false, error: null }]));
            let timedOut = false, overflow = false, error = null, exit = null, close = null;
            const kills = [];
            const start = process.hrtime.bigint();
            const child = spawn(executable, argv, { cwd, env, shell: false, stdio: ['ignore', 'pipe', 'pipe'] });
            function stop(reason) {
              // Direct child only: this does not clean up or contain grandchildren.
              kills.push({ reason, signal: 'SIGKILL', sent: child.kill('SIGKILL') });
              child.stdout.destroy();
              child.stderr.destroy();
            }
            const timer = setTimeout(() => { timedOut = true; stop('timeout'); }, timeoutMs);
            for (const name of ['stdout', 'stderr']) {
              const stream = streams[name];
              child[name].on('data', chunk => {
                stream.receivedBytes += chunk.length;
                const retained = chunk.subarray(0, Math.max(0, perStreamLimit - stream.retainedBytes));
                if (retained.length) stream.chunks.push(Buffer.from(retained));
                stream.retainedBytes += retained.length;
                if (stream.receivedBytes > perStreamLimit && !overflow) { overflow = true; stop('overflow'); }
              });
              child[name].on('end', () => { stream.eof = true; });
              child[name].on('close', () => { stream.closed = true; });
              child[name].on('error', e => { stream.error = { message: e.message, code: e.code ?? null }; stop(name + '-error'); });
            }
            child.on('error', e => { error = { message: e.message, code: e.code ?? null }; stop('child-error'); });
            child.on('exit', (status, signal) => {
              exit = { status, signal };
              if (status !== 0 || signal !== null) stop('unsuccessful-exit');
            });
            await new Promise(resolve => child.on('close', (status, signal) => {
              close = { status, signal };
              clearTimeout(timer);
              resolve();
            }));
            const elapsedMs = Number(process.hrtime.bigint() - start) / 1e6;
            const output = {};
            for (const name of ['stdout', 'stderr']) {
              const { chunks, ...counts } = streams[name];
              const bytes = Buffer.concat(chunks);
              const file = path.join(root, 'u1.' + name);
              fs.writeFileSync(file, bytes, { flag: 'wx', mode: 0o600 });
              output[name] = { ...counts, file, sha256: sha(file) };
              console.log('U1 raw ' + name + ' begin');
              process.stdout.write(bytes);
              console.log('\nU1 raw ' + name + ' end');
            }
            const receipt = { executable, nodeSha256: sha(executable), argv, cwd, env,
              python, pythonSha256, launcher, timeoutMs, perStreamLimit, elapsedMs,
              timedOut, overflow, error, exit, close, kills, output };
            fs.writeFileSync(path.join(root, 'u1-result.json'), JSON.stringify(receipt, null, 2) + '\n',
              { flag: 'wx', mode: 0o600 });
            console.log(JSON.stringify(receipt));
            assert.equal(error, null);
            assert(!timedOut && !overflow && elapsedMs <= timeoutMs);
            assert.deepEqual(exit, { status: 0, signal: null });
            assert.deepEqual(close, { status: 0, signal: null });
            for (const stream of Object.values(streams)) {
              assert(stream.eof && stream.closed && stream.error === null);
            }
          }
          main().catch(error => { console.error(error); process.exitCode = 1; });
          U1_NODE
      - name: U2 receipt inventory and adapter regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          umask 077
          env -i TMPDIR="$TMPDIR" PATH=/usr/bin:/bin \
            "$NODE_EXECUTABLE" --input-type=commonjs <<'U2_NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawn } = require('node:child_process');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const fileHash = file => sha(fs.readFileSync(file));
          const errorInfo = e => ({ message: String(e.message), code: e.code ?? null });
          async function main() {
            process.umask(0o077);
            const parent = process.env.TMPDIR;
            assert(parent && path.isAbsolute(parent) && !/[\r\n\t]/.test(parent));
            assert.equal(fs.realpathSync(parent), parent);
            function privateDirectory(dir) {
              const stat = fs.lstatSync(dir);
              assert(stat.isDirectory() && !stat.isSymbolicLink());
              assert.equal(stat.uid, process.getuid());
              assert.equal(stat.mode & 0o777, 0o700);
            }
            privateDirectory(parent);
            const root = fs.mkdtempSync(path.join(parent, 'u2-managed-'));
            privateDirectory(root);
            const owned = {};
            for (const name of ['home', 'config', 'cache', 'data', 'tmp']) {
              owned[name] = path.join(root, name);
              fs.mkdirSync(owned[name], { mode: 0o700 });
              privateDirectory(owned[name]);
            }
            const env = { HOME: owned.home, USERPROFILE: owned.home,
              XDG_CONFIG_HOME: owned.config, XDG_CACHE_HOME: owned.cache,
              XDG_DATA_HOME: owned.data, TMPDIR: owned.tmp, TEMP: owned.tmp, TMP: owned.tmp,
              PATH: '/usr/bin:/bin' };
            // All unchanged suite children fork Node. No Python, shell or PATH launcher is needed.
            const executable = process.execPath;
            assert.equal(fs.realpathSync(executable), executable);
            assert(fs.lstatSync(executable).isFile());
            const cwd = fs.realpathSync(process.cwd());
            const argv = ['--test', '--test-concurrency=1',
              'dist/tests/request-capture/receipt.test.js',
              'dist/tests/request-capture/inventory.test.js',
              'dist/tests/request-capture/adapters.test.js'];
            const timeoutMs = 170000, perStreamLimit = 1048576;
            const save = (name, bytes) => fs.writeFileSync(path.join(root, name), bytes,
              { flag: 'wx', mode: 0o600 });
            const descriptor = { executable, nodeSha256: fileHash(executable), argv, cwd, env,
              bootstrap: { argv: process.argv, execArgv: process.execArgv,
                env: { TMPDIR: parent, PATH: process.env.PATH }, cwd: process.cwd() },
              timeoutMs, perStreamLimit,
              workflowSha256: fileHash(path.join(cwd, '.github/workflows/validation-1238-managed-consumers.yml')),
              suites: argv.slice(2).map(file => ({ file, sha256: fileHash(path.join(cwd, file)) })),
              root, scope: 'owned synthetic hosted lane; direct child only; no descendant containment' };
            save('invocation.json', JSON.stringify(descriptor, null, 2) + '\n');
            console.log('U2 invocation ' + JSON.stringify(descriptor));
            const streams = Object.fromEntries(['stdout', 'stderr'].map(name => [name,
              { receivedBytes: 0, retainedBytes: 0, chunks: [], eof: false, closed: false, errors: [] }]));
            const errors = [], kills = [], destroys = [];
            let timedOut = false, overflow = false, exit = null, close = null, stopping = false;
            let child = null;
            const start = process.hrtime.bigint();
            function stop(reason) {
              if (stopping) return;
              stopping = true;
              // A successful direct-child kill is not evidence of descendant termination.
              try {
                const sent = child.kill('SIGKILL');
                kills.push({ reason, signal: 'SIGKILL', sent });
                if (!sent) errors.push({ operation: 'kill', message: 'SIGKILL was not sent', reason });
              } catch (e) {
                errors.push({ operation: 'kill', reason, ...errorInfo(e) });
              }
              for (const name of ['stdout', 'stderr']) {
                try {
                  child[name].destroy();
                  destroys.push({ name, requested: true });
                } catch (e) {
                  errors.push({ operation: 'destroy', name, ...errorInfo(e) });
                }
              }
            }
            let timer;
            try {
              child = spawn(executable, argv, { cwd, env, shell: false, stdio: ['ignore', 'pipe', 'pipe'] });
              const closed = new Promise(resolve => {
                child.on('error', e => { errors.push({ operation: 'child', ...errorInfo(e) }); stop('child-error'); });
                child.on('exit', (status, signal) => {
                  exit = { status, signal };
                  if (status !== 0 || signal !== null) stop('unsuccessful-exit');
                });
                child.on('close', (status, signal) => { close = { status, signal }; resolve(); });
              });
              for (const name of ['stdout', 'stderr']) {
                const stream = streams[name];
                child[name].on('data', chunk => {
                  stream.receivedBytes += chunk.length;
                  const retained = chunk.subarray(0, Math.max(0, perStreamLimit - stream.retainedBytes));
                  if (retained.length) stream.chunks.push(Buffer.from(retained));
                  stream.retainedBytes += retained.length;
                  if (stream.receivedBytes > perStreamLimit && !overflow) { overflow = true; stop('overflow'); }
                });
                child[name].on('end', () => { stream.eof = true; });
                child[name].on('close', () => { stream.closed = true; });
                child[name].on('error', e => { stream.errors.push(errorInfo(e)); stop(name + '-error'); });
              }
              // Timers request refusal/termination; they do not guarantee elapsed time or cleanup.
              timer = setTimeout(() => { timedOut = true; stop('timeout'); }, timeoutMs);
              await closed;
            } catch (e) {
              errors.push({ operation: 'spawn-or-observe', ...errorInfo(e) });
              if (child) stop('observation-error');
            } finally {
              clearTimeout(timer);
            }
            const elapsedMs = Number(process.hrtime.bigint() - start) / 1e6;
            const output = {};
            for (const name of ['stdout', 'stderr']) {
              const { chunks, ...counts } = streams[name];
              const bytes = Buffer.concat(chunks);
              save('u2.' + name, bytes);
              output[name] = { ...counts, file: path.join(root, 'u2.' + name), sha256: sha(bytes) };
            }
            const receipt = { ...descriptor, elapsedMs, timedOut, overflow, errors, exit, close,
              status: close?.status ?? null, signal: close?.signal ?? null, kills, destroys, output };
            save('u2-result.json', JSON.stringify(receipt, null, 2) + '\n');
            console.log('U2 result ' + JSON.stringify(receipt));
            for (const name of ['stdout', 'stderr']) {
              console.log('U2 raw ' + name + ' begin');
              const bytes = Buffer.concat(streams[name].chunks);
              await new Promise((resolve, reject) => process.stdout.write(bytes, e => e ? reject(e) : resolve()));
              console.log('\nU2 raw ' + name + ' end');
            }
            assert.equal(errors.length, 0);
            assert(!timedOut && !overflow && elapsedMs <= timeoutMs);
            assert.deepEqual(exit, { status: 0, signal: null });
            assert.deepEqual(close, { status: 0, signal: null });
            for (const stream of Object.values(streams)) {
              assert(stream.eof && stream.closed && stream.errors.length === 0);
              assert(stream.receivedBytes <= perStreamLimit);
            }
          }
          process.stdout.on('error', error => { process.exitCode = 1; });
          process.stderr.on('error', error => { process.exitCode = 1; });
          main().catch(error => { console.error(error); process.exitCode = 1; });
          U2_NODE
