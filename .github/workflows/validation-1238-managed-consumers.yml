            "$NODE_EXECUTABLE" --input-type=commonjs <<'U2_NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawn } = require('node:child_process');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const fileHash = file => sha(fs.readFileSync(file));
          const errorInfo = e => ({ message: String(e.message), code: e.code ?? null });
          async function main() {
            process.umask(0o077);
            const parent = process.env.TMPDIR;
            assert(parent && path.isAbsolute(parent) && !/[\r\n\t]/.test(parent));
            assert.equal(fs.realpathSync(parent), parent);
            function privateDirectory(dir) {
              const stat = fs.lstatSync(dir);
              assert(stat.isDirectory() && !stat.isSymbolicLink());
              assert.equal(stat.uid, process.getuid());
              assert.equal(stat.mode & 0o777, 0o700);
            }
            privateDirectory(parent);
            const root = fs.mkdtempSync(path.join(parent, 'u2-managed-'));
            privateDirectory(root);
            const owned = {};
            for (const name of ['home', 'config', 'cache', 'data', 'tmp', 'diagnostics']) {
              owned[name] = path.join(root, name);
              fs.mkdirSync(owned[name], { mode: 0o700 });
              privateDirectory(owned[name]);
            }
            const env = { HOME: owned.home, USERPROFILE: owned.home,
              XDG_CONFIG_HOME: owned.config, XDG_CACHE_HOME: owned.cache,
              XDG_DATA_HOME: owned.data, TMPDIR: owned.tmp, TEMP: owned.tmp, TMP: owned.tmp,
              PATH: '/usr/bin:/bin' };
            const executable = process.execPath;
            assert.equal(fs.realpathSync(executable), executable);
            assert(fs.lstatSync(executable).isFile());
            const cwd = fs.realpathSync(process.cwd());
            const nodeSha256 = fileHash(executable);
            const workflowSha256 = fileHash(path.join(cwd, '.github/workflows/validation-1238-managed-consumers.yml'));
            const save = (name, bytes) => fs.writeFileSync(path.join(root, name), bytes,
              { flag: 'wx', mode: 0o600 });
            const invalid = Buffer.from('export { syntax invalid');
            const valid = Buffer.from('export {}');
            assert.equal(invalid.length, 23);
            const programs = { 'plain.js': invalid, 'invalid.mjs': invalid, 'valid.mjs': valid };
            // An owned untyped package boundary makes the future .js context explicit.
            const packageBytes = Buffer.from('{}\n');
            fs.writeFileSync(path.join(owned.diagnostics, 'package.json'), packageBytes, { flag: 'wx', mode: 0o600 });
            for (const [name, bytes] of Object.entries(programs)) {
              fs.writeFileSync(path.join(owned.diagnostics, name), bytes, { flag: 'wx', mode: 0o600 });
            }
            const context = { executable, nodeSha256, workflowSha256, env, root,
              bootstrap: { argv: process.argv, execArgv: process.execArgv,
                env: { TMPDIR: parent, PATH: process.env.PATH }, cwd: process.cwd() },
              diagnostics: { cwd: owned.diagnostics, packageJson: '{}\n', packageSha256: sha(packageBytes),
                priorObservation: 'Local invalid .js --check returned zero with empty streams; no cause inferred and no syntax acceptance.',
                priorContext: 'broken-module.intentional.js outside restored repo; no package ancestry measurement claimed.',
                futureContext: 'Owned empty package.json; .js observational, .mjs and forced-module stdin are gates.' },
              scope: 'owned synthetic hosted lane; no descendant containment' };
            save('context.json', JSON.stringify(context, null, 2) + '\n');
            const aggregateMs = 170000;
            const aggregateStart = process.hrtime.bigint();
            const aggregateElapsed = () => Number(process.hrtime.bigint() - aggregateStart) / 1e6;

            async function run(name, argv, childCwd, capMs, perStreamLimit, source, stdinBytes = null) {
              const remainingMs = Math.floor(aggregateMs - aggregateElapsed());
              assert(remainingMs > 0, 'U2 aggregate deadline exhausted before ' + name);
              const timeoutMs = Math.min(capMs, remainingMs);
              const descriptor = { ...context, name, argv, cwd: childCwd, source, stdinSha256: stdinBytes === null ? null : sha(stdinBytes),
                stdinBytes: stdinBytes === null ? 0 : stdinBytes.length, timeoutMs, perStreamLimit, aggregateMs,
                aggregateElapsedAtStartMs: aggregateElapsed(), remainingMs };
              save(name + '.invocation.json', JSON.stringify(descriptor, null, 2) + '\n');
              console.log('U2 invocation ' + JSON.stringify(descriptor));
              const streams = Object.fromEntries(['stdout', 'stderr'].map(key => [key,
                { receivedBytes: 0, retainedBytes: 0, chunks: [], eof: false, closed: false, errors: [] }]));
              const errors = [], kills = [], destroys = [];
              let timedOut = false, overflow = false, exit = null, close = null, stopping = false;
              let child = null, timer;
              const start = process.hrtime.bigint();
              function stop(reason) {
                if (stopping) return;
                stopping = true;
                // Never kill after an observed exit. Direct-child termination is not descendant cleanup.
                if (child && exit === null) {
                  try {
                    const sent = child.kill('SIGKILL');
                    kills.push({ reason, signal: 'SIGKILL', sent });
                    if (!sent) errors.push({ operation: 'kill', message: 'SIGKILL was not sent', reason });
                  } catch (e) { errors.push({ operation: 'kill', reason, ...errorInfo(e) }); }
                }
                if (child) for (const key of ['stdout', 'stderr', ...(stdinBytes === null ? [] : ['stdin'])]) {
                  try { child[key].destroy(); destroys.push({ name: key, requested: true }); }
                  catch (e) { errors.push({ operation: 'destroy', name: key, ...errorInfo(e) }); }
                }
              }
              try {
                assert(aggregateElapsed() < aggregateMs, 'U2 aggregate exhausted before spawn');
                child = spawn(executable, argv, { cwd: childCwd, env, shell: false,
                  stdio: [stdinBytes === null ? 'ignore' : 'pipe', 'pipe', 'pipe'] });
                const closed = new Promise(resolve => {
                  child.on('error', e => { errors.push({ operation: 'child', ...errorInfo(e) }); stop('child-error'); });
                  // A genuine red test exit is retained while both pipes continue to drain.
                  child.on('exit', (status, signal) => { exit = { status, signal }; });
                  child.on('close', (status, signal) => { close = { status, signal }; resolve(); });
                });
                for (const key of ['stdout', 'stderr']) {
                  const stream = streams[key];
                  child[key].on('data', chunk => {
                    stream.receivedBytes += chunk.length;
                    const retained = chunk.subarray(0, Math.max(0, perStreamLimit - stream.retainedBytes));
                    if (retained.length) stream.chunks.push(Buffer.from(retained));
