name: Windows fake cmux native qualification (#1167, test-only)

# #1167. Isolated, test-only qualification of the win32 fake cmux.exe fixture. It runs ONE driver,
# tests/dispatch/windows-fake-cmux-acceptance.mjs, against the built candidate and uploads its
# sanitized receipt. A green run qualifies the fake only. It is NOT product, release, install or
# native host acceptance, and it implies no consumer Windows support: package.json os[] still
# refuses win32 (pinned below), and `npm ci --force` is the same CI-only bypass ci.yml W1 uses.
# The full fixture tests 85/86 and the W1 debt ratchet stay separate gates and are not run here.

on:
  push:
    branches: [ test/1167-native-fake-20261004 ]
    paths:
      - .github/workflows/windows-fake-cmux-acceptance.yml
      - tests/dispatch/windows-fake-cmux-acceptance.mjs
      - tests/dispatch/fake-cmux-win32.ts
      - tests/dispatch/model-router-fixtures.ts
      - tests/dispatch/model-router-fixtures.test.ts

permissions:
  contents: read

concurrency:
  group: windows-fake-cmux-acceptance-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-fake-cmux:
    name: Windows native fake cmux qualification
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Before checkout: the pins below are LF bytes, so no CRLF conversion may touch the tree. The
      # placeholder receipt means a run that never reaches the driver still uploads a FAILED receipt.
      - name: Keep LF bytes and seed a FAILED placeholder receipt
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          printf "%s\n" "{\"schema\":\"aigentry/1167-windows-fake-cmux-acceptance/v1\",\"task\":\"1167\",\"status\":\"FAILED\",\"reason\":\"driver-not-reached\",\"productAcceptance\":false,\"release_acceptance\":false,\"nativeHostSupport\":false,\"qualifiedFake\":false}" > "${RUNNER_TEMP}/windows-fake-cmux-acceptance-receipt.json"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Exact source pins before anything from the tree executes; any mismatch fails the job.
      - name: Pinned sources must match before execution
        run: |
          set -euo pipefail
          echo "checked-out sha: ${GITHUB_SHA}"
          FAIL=0
          check() {
            if [ ! -f "$2" ]; then echo "::error::$2 is missing"; FAIL=1; return 0; fi
            ACTUAL="$(sha256sum -b -- "$2" | cut -d" " -f1)"
            if [ "${ACTUAL}" = "$1" ]; then echo "pin ok ${ACTUAL} $2"; else echo "::error::$2 sha256 ${ACTUAL} does not match pin $1"; FAIL=1; fi
          }
          check 646c12f0e04e1f5c1fbe50a5aacfecc6c5de746a3ee15b1983590ca7d86c1805 tests/dispatch/fake-cmux-win32.ts
          check f3e88ef3fdd0b999c1274d5d59151aee0888777f908abbcbc630e394ca86c6cf tests/dispatch/model-router-fixtures.ts
          check 5fa262af4a06f26e0cf37832958fdc5f1426a75fe8e8f535a6549d1e9cca74f2 tests/dispatch/model-router-fixtures.test.ts
          check 4b9e73514f34dc5c58a21e40dd6894ab0b208524d2e8d3b01b1fec3b2086ce99 src/session/agent-metadata.ts
          check a5b293836105f2a02072e1cb4214940c61ea2798c3c899e15a3e847222a40f5d package.json
          check 7f867214418ae3ed617dba351c2d4c99064b8e7afd3b9a0d34ece8cc8a94bc97 tsconfig.json
          for FILE in tests/dispatch/windows-fake-cmux-acceptance.mjs .github/workflows/windows-fake-cmux-acceptance.yml; do
            echo "recorded $(sha256sum -b -- "${FILE}" | cut -d" " -f1) ${FILE}"
          done
          [ "${FAIL}" = "0" ] || exit 1

      - name: Install dependencies (CI-only --force past the os[] refusal; not Windows support)
        run: npm ci --force

      - name: Build
        run: npm run build

      # The driver exits nonzero unless qualifiedFake; that exit is the step result, unmasked.
      - name: Native fake cmux qualification driver
        run: node tests/dispatch/windows-fake-cmux-acceptance.mjs > "${RUNNER_TEMP}/windows-fake-cmux-acceptance-receipt.json"

      # Always uploads, including on failure; it changes no step result.
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fake-cmux-acceptance-receipt
          path: ${{ runner.temp }}/windows-fake-cmux-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 7
