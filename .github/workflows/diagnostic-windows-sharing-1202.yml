name: Diagnostic Windows sharing 1202

on:
  push:
    branches: [diag/1202-sharing-20261015]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: npm ci --force
      - name: Build selected test and Windows bridge
        shell: bash
        run: npm run build
      - name: Run the selected exclusive-sharing resolver test
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            --test-name-pattern='win32: an exclusively shared transcript is skipped while a readable store still wins' \
            dist/tests/context-handoff/resolve.test.js \
            > "${RUNNER_TEMP}/windows-sharing-1202.tap" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/windows-sharing-1202.tap"
          exit "$status"
      - name: Upload selected test TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-sharing-1202
          path: ${{ runner.temp }}/windows-sharing-1202.tap
          if-no-files-found: warn
          retention-days: 7
