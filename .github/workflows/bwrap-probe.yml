name: bwrap probe (652)
on:
  push:
    branches: [ci/652-bwrap-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: sandbox-runtime vendor contents after npm ci
        run: |
          node -e 'console.log(require("@anthropic-ai/sandbox-runtime/package.json").version)'
          ls -laR node_modules/@anthropic-ai/sandbox-runtime/vendor | head -40
          file node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp || true
          npm pack @anthropic-ai/sandbox-runtime@0.0.76 --dry-run 2>&1 | grep -iE "seccomp|apply" || true
          grep -n "seccomp\|apply" node_modules/@anthropic-ai/sandbox-runtime/package.json | head
